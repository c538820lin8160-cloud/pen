[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pen"
version = "0.1.0"
description = "A minimal Python starter repository for onboarding"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pen team" }]

[tool.setuptools.packages.find]
where = ["src"]
